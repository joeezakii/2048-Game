<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game - Home</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>

    <div class="home-container">
        <div class="logo-section">
            <h1 class="game-title">2048</h1>
            <p class="game-subtitle">Join the numbers & get to the 2048 tile!</p>
        </div>

        <div class="menu-actions">
            <button class="btn btn-primary" onclick="location.href='game.html'">🎮 Play Game</button>
            <button class="btn btn-secondary" onclick="location.href='dashboard.html'">📊 Dashboard</button>
            <button class="btn btn-secondary" onclick="location.href='leaderboard.html'">🏆 Leaderboard</button>
        </div>

        <div class="how-to-play">
            <h3>How to Play</h3>
            <p>Use your <strong>arrow keys</strong> or <strong>swipe</strong> to move tiles. When two tiles with the same number touch, they <strong>merge into one!</strong></p>
        </div>
    </div>

</body>
</html>
